services:
  - type: web
    name: potters-central-backend
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./functions
    dockerfilePath: ./functions/Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 30
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: GOOGLE_CLOUD_PROJECT
        value: potterscentral-c5666
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      - key: BACKEND_ADMIN_EMAILS
        sync: false
      - key: BACKEND_ALLOWED_ORIGINS
        sync: false
      - key: BACKEND_ENFORCE_APP_CHECK
        value: "true"
      - key: BACKEND_MAX_IMAGE_BYTES
        value: "10485760"
      - key: BACKEND_CRON_SECRET
        sync: false
      - key: BACKEND_STORAGE_DRIVER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: potters-central
      - key: COMMERCE_CURRENCY
        value: INR
      - key: DELIVERY_FEE_PAISE
        value: "5000"
      - key: PREPAID_ENABLED
        value: "true"
      - key: RESERVATION_TTL_MINUTES
        value: "15"
      - key: MANUAL_PAYMENT_VERIFICATION_TTL_MINUTES
        value: "1440"
      - key: MANUAL_PAYMENT_INSTRUCTIONS
        value: Scan the QR, pay the exact order total, and upload the successful-payment screenshot.
      - key: SKU_PREFIX
        value: PC
      - key: SKU_PADDING
        value: "6"
      - key: ORDER_PREFIX
        value: ORD
      - key: ORDER_PADDING
        value: "7"
      - key: BEST_SELLER_WINDOW_DAYS
        value: "90"
      - key: BEST_SELLER_LIMIT
        value: "12"
